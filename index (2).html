<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f2f6fc">
<title>for dad</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%8C%B8%3C/text%3E%3C/svg%3E">
<style>
  :root {
    --paper: #f2f6fc;
    --navy: #0d2b6b;
    --type: "American Typewriter", "Courier Prime", "Courier New", Courier, monospace;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--paper);
    color: var(--navy);
    font-family: var(--type);
    -webkit-text-size-adjust: 100%;
  }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    overflow-x: hidden;
  }

  /* Typed text */
  #stage {
    width: min(100%, 38rem);
    margin: 0 auto;
    padding: 12vh 1.5rem 2rem;
    padding-top: 12dvh;
    text-align: center;
  }
  .line {
    min-height: 1.5em;
    margin: 0 0 0.9em;
    font-size: clamp(1.2rem, 4.6vw, 1.9rem);
    line-height: 1.5;
    overflow-wrap: anywhere;
  }
  .line.long { font-size: clamp(1.05rem, 4vw, 1.5rem); line-height: 1.65; }
  .cursor {
    display: inline-block;
    width: 0.08em;
    height: 1.1em;
    margin-left: 0.12em;
    vertical-align: -0.18em;
    background: var(--navy);
    animation: blink 1s steps(1) infinite;
  }
  @keyframes blink { 50% { opacity: 0; } }

  /* Things that fade in under the text */
  .media {
    display: none;
    margin: 1.2rem auto 0;
    opacity: 0;
    transition: opacity 1s ease;
  }
  .media.show { display: block; }
  .media.in { opacity: 1; }
  #figures { display: block; width: min(88vw, 22rem); height: auto; margin: 0 auto; }

  .polaroid {
    margin: 0 auto;
    width: fit-content;
    max-width: 92%;
    background: #fff;
    padding: 0.6rem 0.6rem 2.4rem;
    border-radius: 4px;
    box-shadow: 0 6px 24px rgba(13, 43, 107, 0.18);
    transform: rotate(-1.5deg);
  }
  .polaroid img {
    display: block;
    width: auto;
    height: auto;
    max-width: min(80vw, 28rem);
    max-height: 48vh;
    max-height: 48dvh;
    border-radius: 2px;
  }
  .placeholder {
    width: min(70vw, 18rem);
    aspect-ratio: 4 / 3;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    text-align: center;
    font-size: 1rem;
    line-height: 1.5;
    color: var(--navy);
    border: 2px dashed var(--navy);
  }

  /* Flowers + button, centered on a blank page */
  .center {
    position: fixed;
    inset: 0;
    display: none;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
  }
  .center.show { display: flex; }
  #flowers { width: min(90vw, 26rem); height: auto; overflow: visible; }

  #restart {
    font: inherit;
    font-size: clamp(1.1rem, 4vw, 1.4rem);
    color: var(--navy);
    background: transparent;
    border: 2px solid var(--navy);
    border-radius: 6px;
    padding: 0.9em 1.8em;
    min-height: 3rem;
    cursor: pointer;
    opacity: 0;
    transition: opacity 1s ease, background-color 0.2s ease, color 0.2s ease;
    -webkit-tap-highlight-color: transparent;
  }
  #restart.visible { opacity: 1; }
  #restart:hover { background: var(--navy); color: var(--paper); }
  #restart:focus-visible { outline: 3px solid #f06292; outline-offset: 4px; }

  @media (prefers-reduced-motion: reduce) {
    .cursor { animation: none; }
    .media { transition-duration: 0.01s; }
  }
</style>
</head>
<body>

<main id="stage">
  <div id="lines"></div>

  <div id="figureWrap" class="media" aria-hidden="true">
    <svg id="figures" viewBox="0 0 320 200" role="img" aria-label="A daughter and her dad hugging, letting go, and waving goodbye"></svg>
  </div>

  <div id="photoWrap" class="media">
    <figure class="polaroid" id="polaroid"></figure>
  </div>
</main>

<div id="flowerWrap" class="center" aria-hidden="true">
  <svg id="flowers" viewBox="0 0 320 240"></svg>
</div>

<div id="restartWrap" class="center">
  <button id="restart" type="button">play again!</button>
</div>

<script>
(function () {
  "use strict";

  /* ---- Your words (edit these) ---- */
  var T1 = "dear dad,";
  var T2 = "hi Dad! i just wanted to wish you a happy birthday!";
  var T3 = "i want to showcase how great a father you are by showing you a quick and simple website like the simple but extraordinary man you are!";
  var T4 = "here is my favorite photo of us";
  var T5 = "anyways i love you and hope all your dreams come true dad";

  /* Your photo: upload it to the same folder as this file and name it photo.jpg */
  var PHOTOS = ["photo.jpg", "photo.jpeg", "photo.png", "photo.webp", "photo.JPG", "photo.JPEG", "photo.PNG"];

  var NAVY = "#0d2b6b";
  var PAPER = "#f2f6fc";
  var NS = "http://www.w3.org/2000/svg";

  var lines = document.getElementById("lines");
  var figureWrap = document.getElementById("figureWrap");
  var photoWrap = document.getElementById("photoWrap");
  var polaroid = document.getElementById("polaroid");
  var flowerWrap = document.getElementById("flowerWrap");
  var restartWrap = document.getElementById("restartWrap");
  var restart = document.getElementById("restart");
  var playing = false;

  /* ---------- small helpers ---------- */
  function sleep(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
  function clamp01(v) { return v < 0 ? 0 : v > 1 ? 1 : v; }
  function ease(t) { return t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2; }
  function backOut(t) { var c1 = 1.70158, c3 = c1 + 1; return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2); }
  function mix(a, b, k) { return a + (b - a) * k; }
  function mixArr(a, b, k) { return [mix(a[0], b[0], k), mix(a[1], b[1], k)]; }

  function tween(ms, fn) {
    return new Promise(function (resolve) {
      var t0 = null;
      function step(now) {
        if (t0 === null) t0 = now;
        var k = clamp01((now - t0) / ms);
        fn(k);
        if (k < 1) requestAnimationFrame(step); else resolve();
      }
      requestAnimationFrame(step);
    });
  }

  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function set(e, o) {
    for (var k in o) {
      var v = o[k];
      e.setAttribute(k, typeof v === "number" ? Math.round(v * 100) / 100 : v);
    }
  }

  /* ---------- typing and deleting ---------- */
  var cursor = document.createElement("span");
  cursor.className = "cursor";
  cursor.setAttribute("aria-hidden", "true");

  function newLine(extra) {
    var line = document.createElement("div");
    line.className = "line" + (extra ? " " + extra : "");
    var t = document.createElement("span");
    line.appendChild(t);
    line.appendChild(cursor);
    lines.appendChild(line);
    return t;
  }

  async function type(span, text, speed) {
    for (var i = 0; i < text.length; i++) {
      span.textContent += text[i];
      var wait = speed * (0.7 + Math.random() * 0.6);
      if (",.!".indexOf(text[i]) !== -1) wait += speed * 3;
      await sleep(wait);
    }
  }

  // Backspaces from the end of the last line to the start of the first
  async function eraseAll() {
    var spans = Array.prototype.slice.call(lines.querySelectorAll(".line > span"));
    var total = spans.reduce(function (n, s) { return n + s.textContent.length; }, 0);
    var step = Math.max(1, Math.ceil(total / 80));
    var idx = spans.length - 1;
    while (idx >= 0) {
      var s = spans[idx];
      if (s.textContent.length === 0) { idx--; continue; }
      s.textContent = s.textContent.slice(0, Math.max(0, s.textContent.length - step));
      await sleep(30);
    }
    lines.innerHTML = "";
  }

  async function fadeIn(wrap) {
    wrap.classList.add("show");
    void wrap.getBoundingClientRect();
    wrap.classList.add("in");
    await sleep(1000);
  }
  async function fadeOut(wrap) {
    wrap.classList.remove("in");
    await sleep(1000);
    wrap.classList.remove("show");
  }

  /* ---------- dad and daughter stick figures ---------- */
  var GROUND = 186;
  var fig = document.getElementById("figures");
  var gDadBody = el("g", {}, fig);
  var gDadArms = el("g", {}, fig);
  var gDaughterBody = el("g", {}, fig);
  var gDaughterArms = el("g", {}, fig);

  function Figure(s, sw, bodyG, armG, daughter) {
    var base = { stroke: NAVY, "stroke-width": sw, "stroke-linecap": "round", "stroke-linejoin": "round", fill: "none" };
    this.s = s;
    this.daughter = daughter;
    this.legL = el("line", base, bodyG);
    this.legR = el("line", base, bodyG);
    if (daughter) {
      this.dress = el("path", { stroke: NAVY, "stroke-width": sw, "stroke-linejoin": "round", fill: "#cfe0f7" }, bodyG);
      this.pigL = el("circle", { fill: NAVY }, bodyG);
      this.pigR = el("circle", { fill: NAVY }, bodyG);
    }
    this.body = el("line", base, bodyG);
    this.head = el("circle", { stroke: NAVY, "stroke-width": sw, fill: PAPER }, bodyG);
    this.eyeL = el("circle", { fill: NAVY }, bodyG);
    this.eyeR = el("circle", { fill: NAVY }, bodyG);
    this.smile = el("path", { stroke: NAVY, "stroke-width": sw * 0.5, "stroke-linecap": "round", fill: "none" }, bodyG);
    this.armL = el("line", base, armG);
    this.armR = el("line", base, armG);
  }
  Figure.prototype.update = function (x, armL, armR) {
    var s = this.s;
    var hipY = GROUND - 38 * s;
    var shY = hipY - 42 * s;
    var headY = shY - 16 * s;
    var r = 13 * s;
    var legTop = this.daughter ? hipY + 5 * s : hipY;
    set(this.legL, { x1: x, y1: legTop, x2: x - 15 * s, y2: GROUND });
    set(this.legR, { x1: x, y1: legTop, x2: x + 15 * s, y2: GROUND });
    set(this.body, { x1: x, y1: shY, x2: x, y2: hipY });
    if (this.daughter) {
      set(this.dress, { d: "M " + x + " " + (shY + 2 * s) + " L " + (x - 15 * s) + " " + (hipY + 5 * s) + " L " + (x + 15 * s) + " " + (hipY + 5 * s) + " Z" });
      set(this.pigL, { cx: x - r - 3 * s, cy: headY + 3 * s, r: 4.5 * s });
      set(this.pigR, { cx: x + r + 3 * s, cy: headY + 3 * s, r: 4.5 * s });
    }
    set(this.head, { cx: x, cy: headY, r: r });
    set(this.eyeL, { cx: x - 4.5 * s, cy: headY - 2 * s, r: 1.5 * s });
    set(this.eyeR, { cx: x + 4.5 * s, cy: headY - 2 * s, r: 1.5 * s });
    set(this.smile, { d: "M " + (x - 5 * s) + " " + (headY + 3.5 * s) + " Q " + x + " " + (headY + 8.5 * s) + " " + (x + 5 * s) + " " + (headY + 3.5 * s) });
    var ay = shY + 3 * s;
    set(this.armL, { x1: x, y1: ay, x2: x + armL[0] * s, y2: ay + armL[1] * s });
    set(this.armR, { x1: x, y1: ay, x2: x + armR[0] * s, y2: ay + armR[1] * s });
  };

  var dad = new Figure(1.2, 4.2, gDadBody, gDadArms, false);
  var daughter = new Figure(0.8, 3.4, gDaughterBody, gDaughterArms, true);

  // Arm positions are offsets from the shoulder, in units of the figure's size
  var HUG = { fx: 150, dx: 170, fl: [25, 33.7], fr: [30, 25.3], dl: [-37.5, 4.5], dr: [-35, 14.5] };
  var APART = { fx: 112, dx: 208, fl: [-15, 36], fr: [15, 36], dl: [-14, 36], dr: [14, 36] };

  function mixPose(a, b, k) {
    return {
      fx: mix(a.fx, b.fx, k), dx: mix(a.dx, b.dx, k),
      fl: mixArr(a.fl, b.fl, k), fr: mixArr(a.fr, b.fr, k),
      dl: mixArr(a.dl, b.dl, k), dr: mixArr(a.dr, b.dr, k)
    };
  }
  function setPose(p) {
    dad.update(p.fx, p.fl, p.fr);
    daughter.update(p.dx, p.dl, p.dr);
  }
  function polar(len, deg) {
    var r = deg * Math.PI / 180;
    return [len * Math.sin(r), -len * Math.cos(r)];
  }
  async function waveGoodbye() {
    await tween(4200, function (k) {
      var up = ease(clamp01(k / 0.12)) * (1 - ease(clamp01((k - 0.88) / 0.12)));
      var phase = k * 4.2 * 2 * Math.PI * 1.5;
      var dadHand = polar(38.5, 52 + 20 * Math.sin(phase));
      var kidHand = polar(38.5, 52 + 20 * Math.sin(phase + 0.8));
      setPose({
        fx: APART.fx, dx: APART.dx, fl: APART.fl, dl: APART.dl,
        fr: mixArr(APART.fr, dadHand, up),
        dr: mixArr(APART.dr, kidHand, up)
      });
    });
  }
  async function figureScene() {
    setPose(HUG);
    await fadeIn(figureWrap);
    await sleep(2300);                                   // hugging
    await tween(1200, function (k) { setPose(mixPose(HUG, APART, ease(k))); }); // let go
    await sleep(500);
    await waveGoodbye();                                 // wave goodbye
    await sleep(300);
  }

  /* ---------- the photo ---------- */
  var photoURL = null;
  function findPhoto(i) {
    if (i >= PHOTOS.length) return;
    var im = new Image();
    im.onload = function () { photoURL = PHOTOS[i]; };
    im.onerror = function () { findPhoto(i + 1); };
    im.src = PHOTOS[i];
  }
  function fillPolaroid() {
    polaroid.innerHTML = "";
    if (photoURL) {
      var img = document.createElement("img");
      img.src = photoURL;
      img.alt = "A photo of us";
      polaroid.appendChild(img);
    } else {
      var ph = document.createElement("div");
      ph.className = "placeholder";
      ph.textContent = "your photo goes here. Upload it to this folder as photo.jpg";
      polaroid.appendChild(ph);
    }
  }

  /* ---------- the flowers ---------- */
  var fl = document.getElementById("flowers");
  var FL = [
    { x: 48,  top: 150, bend: 10,  c: "#ffca28", mid: "#8d6e63", r: 10, rot: 0 },
    { x: 104, top: 96,  bend: -12, c: "#f06292", mid: "#ffd54f", r: 14, rot: 15 },
    { x: 160, top: 52,  bend: 8,   c: "#b39ddb", mid: "#ffd54f", r: 17, rot: 0 },
    { x: 216, top: 104, bend: 12,  c: "#ff8a65", mid: "#ffd54f", r: 14, rot: 10 },
    { x: 272, top: 146, bend: -10, c: "#f8bbd0", mid: "#ffb74d", r: 11, rot: 0 }
  ];
  var ground = el("line", { stroke: "#5fae6b", "stroke-width": 4, "stroke-linecap": "round" }, fl);
  FL.forEach(function (f, i) {
    f.p0 = [f.x, 228];
    f.p1 = [f.x - f.bend * 1.5, (228 + f.top) / 2];
    f.p2 = [f.x + f.bend, f.top];
    f.stem = el("path", { fill: "none", stroke: "#4f9a5b", "stroke-width": 4, "stroke-linecap": "round" }, fl);
    f.leaf = el("path", { d: "M0 0 Q9 -7 20 0 Q9 7 0 0 Z", fill: "#5fae6b" }, fl);
    f.head = el("g", {}, fl);
    for (var k = 0; k < 6; k++) {
      el("ellipse", { cx: 0, cy: -f.r * 0.75, rx: f.r * 0.55, ry: f.r * 0.8, fill: f.c, stroke: NAVY, "stroke-width": 1.4, transform: "rotate(" + k * 60 + ")" }, f.head);
    }
    el("circle", { cx: 0, cy: 0, r: f.r * 0.38, fill: f.mid, stroke: NAVY, "stroke-width": 1.4 }, f.head);
  });
  function bez(p0, p1, p2, t) {
    var a = [mix(p0[0], p1[0], t), mix(p0[1], p1[1], t)];
    var b = [mix(p1[0], p2[0], t), mix(p1[1], p2[1], t)];
    return { c: a, e: [mix(a[0], b[0], t), mix(a[1], b[1], t)] };
  }
  function renderFlowers(p) {
    var g = ease(clamp01(p / 0.12));
    set(ground, { x1: 160 - 140 * g, y1: 230, x2: 160 + 140 * g, y2: 230 });
    ground.setAttribute("visibility", g > 0 ? "visible" : "hidden");
    FL.forEach(function (f, i) {
      var s0 = 0.08 + i * 0.09;
      var st = ease(clamp01((p - s0) / 0.32));
      var lk = ease(clamp01((p - s0 - 0.2) / 0.15));
      var hk = backOut(clamp01((p - s0 - 0.32) / 0.24));
      if (st > 0) {
        var q = bez(f.p0, f.p1, f.p2, st);
        set(f.stem, { d: "M " + f.p0[0] + " " + f.p0[1] + " Q " + q.c[0] + " " + q.c[1] + " " + q.e[0] + " " + q.e[1], visibility: "visible" });
      } else {
        f.stem.setAttribute("visibility", "hidden");
      }
      if (lk > 0.01) {
        var lp = bez(f.p0, f.p1, f.p2, 0.55).e;
        var ang = i % 2 ? 210 : -30;
        set(f.leaf, { transform: "translate(" + lp[0].toFixed(2) + "," + lp[1].toFixed(2) + ") rotate(" + ang + ") scale(" + lk.toFixed(3) + ")", visibility: "visible" });
      } else {
        f.leaf.setAttribute("visibility", "hidden");
      }
      if (hk > 0.01) {
        set(f.head, { transform: "translate(" + f.p2[0] + "," + f.p2[1] + ") rotate(" + f.rot + ") scale(" + hk.toFixed(3) + ")", visibility: "visible" });
      } else {
        f.head.setAttribute("visibility", "hidden");
      }
    });
  }

  /* ---------- the whole show ---------- */
  function reset() {
    lines.innerHTML = "";
    figureWrap.className = "media";
    photoWrap.className = "media";
    flowerWrap.className = "center";
    restartWrap.className = "center";
    restart.classList.remove("visible");
    setPose(HUG);
    renderFlowers(0);
  }

  async function play() {
    if (playing) return;
    playing = true;
    reset();
    await sleep(900);

    // 1. dear dad / happy birthday
    var a = newLine();
    await type(a, T1, 110);
    await sleep(700);
    var b = newLine();
    await type(b, T2, 65);
    await sleep(1000);

    // 2. hug, let go, wave goodbye
    await figureScene();

    // 3. erase the text like deleting
    fadeOut(figureWrap);
    await eraseAll();
    await sleep(700);

    // 4. showcase message
    var c = newLine("long");
    await type(c, T3, 55);
    await sleep(2200);
    await eraseAll();
    await sleep(700);

    // 5. the photo
    var d = newLine();
    await type(d, T4, 70);
    await sleep(700);
    fillPolaroid();
    await fadeIn(photoWrap);
    await sleep(6500);
    fadeOut(photoWrap);
    await eraseAll();
    await sleep(700);

    // 6. final message
    var e = newLine("long");
    await type(e, T5, 70);
    await sleep(3500);
    await eraseAll();
    await sleep(700);

    // 7. flowers are drawn, hold, then erased
    flowerWrap.classList.add("show");
    await tween(4200, function (k) { renderFlowers(k); });
    await sleep(4000);
    await tween(2400, function (k) { renderFlowers(1 - k); });
    await sleep(500);
    flowerWrap.classList.remove("show");
    await sleep(700);

    // 8. the button
    restartWrap.classList.add("show");
    void restart.getBoundingClientRect();
    restart.classList.add("visible");
    restart.focus({ preventScroll: true });
    playing = false;
  }

  findPhoto(0);
  restart.addEventListener("click", play);
  /*TESTHOOK*/
  play();
})();
</script>
</body>
</html>
